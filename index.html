<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🌱 VitaRay - Управление производством</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #F8FDF8;
            color: #1B5E20;
            line-height: 1.4;
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .app-header h1 {
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .date-display {
            color: #66BB6A;
            font-size: 14px;
            margin-top: 4px;
        }

        /* Navigation */
        .nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .nav-btn {
            background: #E8F5E9;
            border: none;
            padding: 12px 16px;
            border-radius: 40px;
            color: #2E7D32;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .nav-btn.active {
            background: #2E7D32;
            color: white;
        }

        /* Sections */
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }

        /* Cards & Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #E8F5E9;
        }
        .stat-number {
            font-size: 26px;
            font-weight: 700;
            color: #1B5E20;
        }
        .stat-label {
            font-size: 12px;
            color: #558B2F;
        }

        .btn {
            background: #2E7D32;
            color: white;
            border: none;
            padding: 14px 18px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 12px 0;
            transition: 0.2s;
        }
        .btn-secondary {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }
        .btn-small {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #E8F5E9;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .card-title {
            font-weight: 700;
            font-size: 16px;
        }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .status-paid { background: #C8E6C9; color: #1B5E20; }
        .status-unpaid { background: #FFEBEE; color: #C62828; }
        .status-delivered { background: #E0F2FE; color: #0369a1; }
        .status-pending { background: #FFF3E0; color: #EF6C00; }
        .status-soaking { background: #E3F2FD; color: #0b5e7c; }
        .status-sprouting { background: #E8F5E9; color: #2E7D32; }
        .status-harvest { background: #FCE4EC; color: #AD1457; }

        .progress-bar {
            background: #E8F5E9;
            border-radius: 12px;
            height: 8px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-fill {
            background: #2E7D32;
            width: 0%;
            height: 100%;
            border-radius: 12px;
        }

        .task-item {
            background: #F1F8E9;
            padding: 12px;
            border-radius: 16px;
            margin: 8px 0;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 28px;
            max-width: 500px;
            margin: 20px auto;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #C8E6C9;
            border-radius: 16px;
            font-size: 15px;
            background: #FEFEFE;
        }
        .flex-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #81C784;
        }
        hr {
            margin: 12px 0;
            border-color: #E8F5E9;
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .nav { flex-wrap: nowrap; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>🌱 VitaRay</h1>
        <div class="date-display" id="currentDate"></div>
    </div>

    <nav class="nav">
        <button class="nav-btn active" data-section="dashboard">🏠 Главная</button>
        <button class="nav-btn" data-section="batches">📦 Партии</button>
        <button class="nav-btn" data-section="orders">📋 Заказы</button>
        <button class="nav-btn" data-section="clients">👥 Клиенты</button>
        <button class="nav-btn" data-section="expenses">💰 Расходы</button>
        <button class="nav-btn" data-section="reports">📊 Отчёты</button>
    </nav>

    <!-- ======================= DASHBOARD ======================= -->
    <section id="dashboard" class="section active">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="monthRevenue">0₽</div><div class="stat-label">Выручка за месяц</div></div>
            <div class="stat-card"><div class="stat-number" id="monthProfit">0₽</div><div class="stat-label">Чистая прибыль</div></div>
        </div>
        <h3>📦 Текущие заказы (неоплач./невыд.)</h3>
        <div id="pendingOrdersList"></div>
        <h3>⏰ Планы на сегодня</h3>
        <div id="todayTasks"></div>
        <div class="flex-btns">
            <button class="btn btn-small" onclick="showModal('newBatchModal')">➕ Новая партия</button>
            <button class="btn btn-small btn-secondary" onclick="showModal('newOrderModal')">📦 Новый заказ</button>
        </div>
    </section>

    <!-- ======================= BATCHES ======================= -->
    <section id="batches" class="section">
        <button class="btn" onclick="showModal('newBatchModal')">🌱 Новая партия</button>
        <div id="batchesList"></div>
    </section>

    <!-- ======================= ORDERS ======================= -->
    <section id="orders" class="section">
        <button class="btn" onclick="showModal('newOrderModal')">📋 Создать заказ</button>
        <div id="ordersList"></div>
    </section>

    <!-- ======================= CLIENTS ======================= -->
    <section id="clients" class="section">
        <button class="btn" onclick="showModal('newClientModal')">👥 Добавить клиента</button>
        <input type="text" id="clientSearch" class="search-input" placeholder="🔍 Поиск клиента" onkeyup="filterClients()" style="margin:10px 0; padding:12px; border-radius:30px;">
        <div id="clientsList"></div>
    </section>

    <!-- ======================= EXPENSES ======================= -->
    <section id="expenses" class="section">
        <button class="btn" onclick="showModal('newExpenseModal')">💸 Добавить расход</button>
        <div id="expensesList"></div>
        <div class="card"><div class="card-title">📊 Калькулятор себестоимости</div><div id="costCalculatorView"></div></div>
    </section>

    <!-- ======================= REPORTS ======================= -->
    <section id="reports" class="section">
        <h3>📈 Отчёт за последнюю неделю</h3>
        <div id="weeklyReport"></div>
        <h3 style="margin-top:20px">🏆 Достижения</h3>
        <div id="achievementsList"></div>
        <button class="btn btn-secondary" onclick="showModal('newAchievementModal')">✨ Добавить достижение</button>
    </section>

    <!-- ======================= MODALS ======================= -->
    <div id="newBatchModal" class="modal"><div class="modal-content"><div class="modal-header"><h3>🌱 Новая партия</h3><button class="close-btn" onclick="hideModal('newBatchModal')">×</button></div>
        <form id="newBatchForm"><div class="form-group"><label>Культура</label><input type="text" id="batchCulture" placeholder="горох, маш, редис" required></div>
        <div class="form-group"><label>Формат (лоток)</label><input type="text" id="batchFormat" placeholder="15×11 / 8×5" value="15×11"></div>
        <div class="form-group"><label>Тип</label><select id="batchType"><option value="microgreen">Микрозелень (5 этапов)</option><option value="sprouts">Проростки (3 этапа)</option></select></div>
        <div class="form-group"><label>Вес сухих семян (г)</label><input type="number" id="batchWeightDry" value="25" required></div>
        <div class="form-group"><label>Субстрат</label><input type="text" id="batchSubstrate" value="джут"></div>
        <div class="form-group"><label>Дата посева</label><input type="date" id="batchDateSown" required></div>
        <div class="flex-btns"><button type="button" class="btn-secondary btn-small" onclick="hideModal('newBatchModal')">Отмена</button><button type="submit" class="btn-small">Создать</button></div>
        </form></div></div>

    <div id="newOrderModal" class="modal"><div class="modal-content"><h3>📋 Новый заказ</h3><form id="newOrderForm">
        <div class="form-group"><label>Клиент</label><select id="orderClient" required></select></div>
        <div class="form-group"><label>Дата</label><input type="date" id="orderDate" required></div>
        <div class="form-group"><label>Продукт / культура</label><input type="text" id="orderProduct" placeholder="горох, маш..." required></div>
        <div class="form-group"><label>Количество (лотков)</label><input type="number" id="orderQty" value="1" required></div>
        <div class="form-group"><label>Цена за лоток (₽)</label><input type="number" id="orderPrice" required></div>
        <div class="form-group"><label>Привязать к партии (опционально)</label><select id="orderPartyId"><option value="">Не выбрано</option></select></div>
        <div class="form-group"><label>Статус оплаты</label><select id="orderPaid"><option value="false">Не оплачен</option><option value="true">Оплачен</option></select></div>
        <div class="form-group"><label>Статус выдачи</label><select id="orderDelivered"><option value="false">Не выдан</option><option value="true">Выдан</option></select></div>
        <div class="flex-btns"><button type="button" class="btn-secondary" onclick="hideModal('newOrderModal')">Отмена</button><button type="submit">Создать заказ</button></div>
        </form></div></div>

    <div id="newClientModal" class="modal"><div class="modal-content"><h3>👥 Новый клиент</h3><form id="newClientForm">
        <div class="form-group"><label>Имя</label><input type="text" id="clientName" required></div>
        <div class="form-group"><label>Адрес/Место</label><input type="text" id="clientAddress"></div>
        <div class="form-group"><label>Контакт</label><input type="text" id="clientContact"></div>
        <div class="flex-btns"><button type="button" class="btn-secondary" onclick="hideModal('newClientModal')">Отмена</button><button type="submit">Добавить</button></div>
        </form></div></div>

    <div id="newExpenseModal" class="modal"><div class="modal-content"><h3>💸 Новый расход</h3><form id="newExpenseForm">
        <div class="form-group"><label>Категория</label><select id="expenseCategory"><option value="seeds">Семена</option><option value="containers">Контейнеры</option><option value="substrate">Субстрат</option></select></div>
        <div class="form-group"><label>Детали (культура/размер/тип)</label><input type="text" id="expenseDetail" placeholder="горох / 8×5×3 / джут"></div>
        <div class="form-group"><label>Количество (г/шт/м)</label><input type="number" id="expenseQty" required></div>
        <div class="form-group"><label>Сумма (₽)</label><input type="number" id="expenseTotal" required></div>
        <div class="form-group"><label>Дата</label><input type="date" id="expenseDate" required></div>
        <div class="flex-btns"><button type="button" class="btn-secondary" onclick="hideModal('newExpenseModal')">Отмена</button><button type="submit">Добавить</button></div>
        </form></div></div>

    <div id="newAchievementModal" class="modal"><div class="modal-content"><h3>🏆 Новое достижение</h3><form id="newAchievementForm">
        <div class="form-group"><label>Описание</label><input type="text" id="achievementDesc" required></div>
        <div class="form-group"><label>Категория</label><input type="text" id="achievementCat" placeholder="sales, production"></div>
        <div class="flex-btns"><button type="button" class="btn-secondary" onclick="hideModal('newAchievementModal')">Отмена</button><button type="submit">Добавить</button></div>
        </form></div></div>

    <div id="viewClientModal" class="modal"><div class="modal-content" id="viewClientContent"></div></div>

    <script>
        // --------------------- STORAGE (сохранение старых данных) ---------------------
        const STORAGE_KEYS = { parties: 'parties', clients: 'clients', orders: 'orders', expenses: 'expenses', achievements: 'achievements', costCalc: 'costCalculator' };
        
        function loadData() {
            // Загрузка с защитой от потери старых данных: читаем существующие или создаём демо
            const parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties)) || [];
            const clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients)) || [];
            let orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)) || [];
            const expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            let achievements = JSON.parse(localStorage.getItem(STORAGE_KEYS.achievements)) || [];
            let costCalc = JSON.parse(localStorage.getItem(STORAGE_KEYS.costCalc)) || { seeds: [], containers: [], substrates: [] };
            
            // МИГРАЦИЯ старых данных из предыдущей версии (mash_app или старый index)
            const oldBatches = JSON.parse(localStorage.getItem('batches')) || [];
            const oldSales = JSON.parse(localStorage.getItem('sales')) || [];
            const oldClients = JSON.parse(localStorage.getItem('clients_old')) || []; // если было другое имя
            
            if (oldBatches.length && parties.length === 0) {
                oldBatches.forEach(b => {
                    parties.push({
                        id: `party_${Date.now()}_${Math.random()}`,
                        culture: b.batchNumber?.toLowerCase() || 'маш',
                        format: '15×11',
                        dateSown: b.date || new Date().toISOString().slice(0,10),
                        weightDry: b.dryWeight || 50,
                        substrate: 'джут',
                        currentStage: (b.status === 'Готово к отправке') ? 'sbor' : 'v_temi',
                        stages: { zomachivanie: b.createdAt || new Date().toISOString(), posev: null, v_temi: null, pod_lampoy: null, srezka: null, sbor: null },
                        cultureType: (b.batchNumber?.includes('маш') || b.batchNumber?.includes('нут')) ? 'sprouts' : 'microgreen'
                    });
                });
            }
            if (oldClients.length && clients.length === 0) clients.push(...oldClients);
            if (oldSales.length && orders.length === 0) {
                oldSales.forEach(s => {
                    orders.push({
                        id: `order_${Date.now()}_${Math.random()}`,
                        clientId: s.clientId || (clients[0]?.id || ''),
                        date: s.date || new Date().toISOString().slice(0,10),
                        items: [{ product: s.batchNumber || 'маш', format: '15×11', quantity: 1, price: s.actualPrice || 100 }],
                        total: s.actualPrice || 100,
                        paid: s.paymentStatus === 'Оплачен',
                        delivered: false,
                        partyId: null
                    });
                });
            }
            
            if (clients.length === 0) {
                clients.push({ id: `client_${Date.now()}_1`, name: 'Овощная лавка', address: 'ул. Центральная', contact: '+79991234567', notes: '', createdAt: new Date().toISOString() });
                clients.push({ id: `client_${Date.now()}_2`, name: 'Кафе Утро', address: 'пр. Мира', contact: '+79876543210', notes: '', createdAt: new Date().toISOString() });
            }
            if (parties.length === 0) {
                parties.push({ id: `party_${Date.now()}_g1`, culture: 'горох', format: '15×11', dateSown: new Date().toISOString().slice(0,10), weightDry: 30, substrate: 'джут', currentStage: 'v_temi', stages: { zomachivanie: new Date().toISOString(), posev: null, v_temi: null, pod_lampoy: null, srezka: null, sbor: null }, cultureType: 'microgreen' });
                parties.push({ id: `party_${Date.now()}_m1`, culture: 'маш', format: '15×11', dateSown: new Date().toISOString().slice(0,10), weightDry: 45, substrate: 'джут', currentStage: 'zomachivanie', stages: { zomachivanie: new Date().toISOString(), posev: null, v_temi: null, pod_lampoy: null, srezka: null, sbor: null }, cultureType: 'sprouts' });
            }
            if (orders.length === 0) {
                orders.push({ id: `order_${Date.now()}_1`, clientId: clients[0].id, date: new Date().toISOString().slice(0,10), items: [{ product: 'горох', format: '8×5', quantity: 2, price: 35 }], total: 70, paid: false, delivered: false, partyId: null });
            }
            if (achievements.length === 0) achievements.push({ id: `ach_${Date.now()}`, date: new Date().toISOString().slice(0,10), description: '🎉 Первая партия создана!', category: 'production' });
            
            localStorage.setItem(STORAGE_KEYS.parties, JSON.stringify(parties));
            localStorage.setItem(STORAGE_KEYS.clients, JSON.stringify(clients));
            localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(orders));
            localStorage.setItem(STORAGE_KEYS.expenses, JSON.stringify(expenses));
            localStorage.setItem(STORAGE_KEYS.achievements, JSON.stringify(achievements));
            localStorage.setItem(STORAGE_KEYS.costCalc, JSON.stringify(costCalc));
            return { parties, clients, orders, expenses, achievements, costCalc };
        }

        function saveKey(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

        // Глобальные данные
        let appData = loadData();

        // Helper: синхронизация калькулятора из расходов
        function updateCostFromExpenses() {
            const expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            let costCalc = { seeds: [], containers: [], substrates: [] };
            expenses.forEach(exp => {
                if (exp.category === 'seeds') {
                    costCalc.seeds.push({ culture: exp.detail?.split(' ')[0] || 'общее', pricePerGram: exp.totalPrice / exp.quantity, lastUpdate: exp.date });
                } else if (exp.category === 'containers') {
                    costCalc.containers.push({ size: exp.detail, pricePerUnit: exp.totalPrice / exp.quantity, lastUpdate: exp.date });
                } else if (exp.category === 'substrate') {
                    costCalc.substrates.push({ type: exp.detail, pricePerMeter: exp.totalPrice / exp.quantity, lastUpdate: exp.date });
                }
            });
            saveKey(STORAGE_KEYS.costCalc, costCalc);
            return costCalc;
        }

        function renderDashboard() {
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)) || [];
            const parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties)) || [];
            const expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            const now = new Date();
            const monthAgo = new Date(now.getFullYear(), now.getMonth()-1, now.getDate());
            const monthOrders = orders.filter(o => new Date(o.date) >= monthAgo && o.paid);
            const monthRevenue = monthOrders.reduce((s,o)=> s + o.total,0);
            const monthExpenses = expenses.filter(e => new Date(e.date) >= monthAgo).reduce((s,e)=> s + e.totalPrice,0);
            document.getElementById('monthRevenue').innerHTML = monthRevenue + '₽';
            document.getElementById('monthProfit').innerHTML = (monthRevenue - monthExpenses) + '₽';
            
            const pendingOrders = orders.filter(o => !o.paid || !o.delivered).slice(0,5);
            const pendingDiv = document.getElementById('pendingOrdersList');
            if(!pendingOrders.length) pendingDiv.innerHTML = '<div class="empty-state">✅ Нет активных задолженностей</div>';
            else pendingDiv.innerHTML = pendingOrders.map(o => `<div class="card"><div class="card-header"><b>${getClientName(o.clientId)}</b><span>${o.date}</span></div><div>${o.items.map(i=>`${i.product} x${i.quantity}`).join(', ')} — ${o.total}₽</div><div class="flex-btns" style="margin-top:8px">${!o.paid ? `<button class="btn-small btn-secondary" onclick="toggleOrderPaid('${o.id}')">✅ Оплатить</button>` : ''}${!o.delivered ? `<button class="btn-small btn-secondary" onclick="toggleOrderDelivered('${o.id}')">📦 Выдать</button>` : ''}</div></div>`).join('');
            
            // Планы на сегодня
            const todayStr = now.toISOString().slice(0,10);
            let tasks = [];
            parties.forEach(p => {
                if(p.currentStage === 'srezka' || p.currentStage === 'sbor') tasks.push(`🌅 УТРО: Срезка/сбор "${p.culture}" (партия от ${p.dateSown})`);
                if(p.currentStage === 'v_temi' || p.currentStage === 'pod_lampoy') tasks.push(`🌙 ВЕЧЕР: Проветрить "${p.culture}"`);
                if(p.currentStage === 'zomachivanie' && p.dateSown === todayStr) tasks.push(`🌙 ВЕЧЕР: Посеять "${p.culture}" (замачивание завершено)`);
            });
            if(!tasks.length) tasks.push('✨ Нет задач на сегодня. Отдыхайте!');
            document.getElementById('todayTasks').innerHTML = tasks.map(t => `<div class="task-item">📌 ${t}</div>`).join('');
        }

        function getClientName(clientId) {
            const clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients)) || [];
            return clients.find(c => c.id === clientId)?.name || 'Клиент';
        }

        function renderBatches() {
            const parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties)) || [];
            const stagesMap = { microgreen: ['zomachivanie','posev','v_temi','pod_lampoy','srezka','sbor'], sprouts: ['zomachivanie','posev','srezka','sbor'] };
            const div = document.getElementById('batchesList');
            if(!parties.length) { div.innerHTML = '<div class="empty-state">Нет партий</div>'; return; }
            div.innerHTML = parties.map(p => {
                const stages = stagesMap[p.cultureType];
                const currentIdx = stages.indexOf(p.currentStage);
                const percent = ((currentIdx+1)/stages.length)*100;
                return `<div class="card"><div class="card-header"><b>${p.culture} (${p.format})</b><span class="status status-${p.currentStage}">${p.currentStage}</span></div><div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div><div class="card-details">🌱 ${p.weightDry}г | 🗓 ${p.dateSown}</div><button class="btn-small btn-secondary" onclick="nextStage('${p.id}')">➡️ Следующий этап</button></div>`;
            }).join('');
        }

        function nextStage(partyId) {
            let parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties));
            const p = parties.find(p=> p.id === partyId);
            if(!p) return;
            const stagesMap = { microgreen: ['zomachivanie','posev','v_temi','pod_lampoy','srezka','sbor'], sprouts: ['zomachivanie','posev','srezka','sbor'] };
            const stages = stagesMap[p.cultureType];
            let idx = stages.indexOf(p.currentStage);
            if(idx < stages.length-1) {
                p.currentStage = stages[idx+1];
                p.stages[p.currentStage] = new Date().toISOString();
                saveKey(STORAGE_KEYS.parties, parties);
                renderBatches(); renderDashboard();
            } else alert('Партия завершена!');
        }

        function renderOrders() {
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)) || [];
            const div = document.getElementById('ordersList');
            if(!orders.length) { div.innerHTML = '<div class="empty-state">Нет заказов</div>'; return; }
            div.innerHTML = orders.slice().reverse().map(o => `<div class="card"><div class="card-header"><b>${getClientName(o.clientId)}</b><div><span class="status ${o.paid ? 'status-paid' : 'status-unpaid'}">${o.paid?'Оплачен':'Не оплачен'}</span> <span class="status ${o.delivered ? 'status-delivered' : 'status-pending'}">${o.delivered?'Выдан':'Не выдан'}</span></div></div><div>${o.items.map(i=>`${i.product} (${i.format}) x${i.quantity} = ${i.price* i.quantity}₽`).join(', ')}</div><div class="card-details">📅 ${o.date} | Итого: ${o.total}₽</div><div class="flex-btns">${!o.paid ? `<button class="btn-small btn-secondary" onclick="toggleOrderPaid('${o.id}')">✅ Оплатить</button>` : ''}${!o.delivered ? `<button class="btn-small btn-secondary" onclick="toggleOrderDelivered('${o.id}')">📦 Выдать</button>` : ''}</div></div>`).join('');
        }

        window.toggleOrderPaid = (id) => { let orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)); let o = orders.find(o=> o.id===id); if(o) { o.paid = !o.paid; saveKey(STORAGE_KEYS.orders, orders); renderOrders(); renderDashboard(); } };
        window.toggleOrderDelivered = (id) => { let orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)); let o = orders.find(o=> o.id===id); if(o) { o.delivered = !o.delivered; saveKey(STORAGE_KEYS.orders, orders); renderOrders(); renderDashboard(); } };

        function renderClients(filter='') {
            let clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients)) || [];
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)) || [];
            if(filter) clients = clients.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
            const div = document.getElementById('clientsList');
            if(!clients.length) { div.innerHTML = '<div class="empty-state">Нет клиентов</div>'; return; }
            div.innerHTML = clients.map(c => `<div class="card"><div class="card-header"><b>${c.name}</b><button class="btn-small btn-secondary" onclick="viewClient('${c.id}')">📋 Подробнее</button></div><div>📍 ${c.address || '—'} | 📞 ${c.contact || '—'}</div><div>📦 Заказов: ${orders.filter(o=>o.clientId===c.id).length}</div></div>`).join('');
        }
        window.filterClients = () => renderClients(document.getElementById('clientSearch').value);
        window.viewClient = (clientId) => {
            const clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients));
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders));
            const client = clients.find(c=>c.id===clientId);
            const clientOrders = orders.filter(o=>o.clientId===clientId).sort((a,b)=>new Date(b.date)-new Date(a.date));
            const modalDiv = document.getElementById('viewClientContent');
            modalDiv.innerHTML = `<div><h3>${client.name}</h3><p>📍 ${client.address||''}<br>📞 ${client.contact||''}</p><hr><h4>Поставки:</h4>${clientOrders.map(o=>`<div>📅 ${o.date} — ${o.items.map(i=>i.product).join(',')} — ${o.total}₽ (${o.paid?'✅':'❌'})</div>`).join('')||'Нет поставок'}<div class="flex-btns"><button onclick="hideModal('viewClientModal')">Закрыть</button></div></div>`;
            showModal('viewClientModal');
        };
        
        function renderExpenses() {
            const expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            const div = document.getElementById('expensesList');
            if(!expenses.length) div.innerHTML = '<div class="empty-state">Нет расходов</div>';
            else div.innerHTML = expenses.slice().reverse().map(e => `<div class="card"><b>${e.category}</b> — ${e.detail} : ${e.quantity} шт/г = ${e.totalPrice}₽ (${e.date})</div>`).join('');
            const costCalc = JSON.parse(localStorage.getItem(STORAGE_KEYS.costCalc)) || {};
            const calcDiv = document.getElementById('costCalculatorView');
            calcDiv.innerHTML = `<div>🌾 Семена: ${costCalc.seeds?.slice(-3).map(s=>`${s.culture} ${s.pricePerGram?.toFixed(2)}₽/г`).join(', ') || 'нет данных'}</div><div>📦 Контейнеры: ${costCalc.containers?.slice(-2).map(c=>`${c.size} ${c.pricePerUnit?.toFixed(2)}₽/шт`).join(', ')||'нет'}</div><div>🧵 Субстрат: ${costCalc.substrates?.slice(-2).map(s=>`${s.type} ${s.pricePerMeter?.toFixed(2)}₽/м`).join(', ')||'нет'}</div>`;
        }

        function renderReports() {
            const orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders)) || [];
            const expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
            const weekOrders = orders.filter(o => new Date(o.date) >= weekAgo && o.paid);
            const weekRevenue = weekOrders.reduce((s,o)=>s+o.total,0);
            const weekExpenses = expenses.filter(e=> new Date(e.date)>=weekAgo).reduce((s,e)=>s+e.totalPrice,0);
            document.getElementById('weeklyReport').innerHTML = `<div class="card"><b>💰 Выручка:</b> ${weekRevenue}₽<br><b>💸 Расходы:</b> ${weekExpenses}₽<br><b>📈 Прибыль:</b> ${weekRevenue-weekExpenses}₽<br><b>📦 Продано лотков:</b> ${weekOrders.reduce((s,o)=>s+o.items.reduce((sum,i)=>sum+i.quantity,0),0)} шт</div>`;
            const achievements = JSON.parse(localStorage.getItem(STORAGE_KEYS.achievements)) || [];
            document.getElementById('achievementsList').innerHTML = achievements.slice().reverse().map(a=>`<div class="card">🏆 ${a.description} (${a.date})</div>`).join('');
        }

        // Add handlers
        document.getElementById('newBatchForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties));
            const cultureType = document.getElementById('batchType').value;
            const newParty = { id: `party_${Date.now()}`, culture: document.getElementById('batchCulture').value, format: document.getElementById('batchFormat').value, dateSown: document.getElementById('batchDateSown').value, weightDry: parseInt(document.getElementById('batchWeightDry').value), substrate: document.getElementById('batchSubstrate').value, currentStage: 'zomachivanie', stages: { zomachivanie: new Date().toISOString(), posev: null, v_temi: null, pod_lampoy: null, srezka: null, sbor: null }, cultureType };
            parties.push(newParty);
            saveKey(STORAGE_KEYS.parties, parties);
            hideModal('newBatchModal'); renderBatches(); renderDashboard();
        });
        document.getElementById('newOrderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let orders = JSON.parse(localStorage.getItem(STORAGE_KEYS.orders));
            const clientId = document.getElementById('orderClient').value;
            const qty = parseInt(document.getElementById('orderQty').value);
            const price = parseInt(document.getElementById('orderPrice').value);
            const product = document.getElementById('orderProduct').value;
            const total = qty * price;
            const newOrder = { id: `order_${Date.now()}`, clientId, date: document.getElementById('orderDate').value, items: [{ product, format: '15×11', quantity: qty, price }], total, paid: document.getElementById('orderPaid').value === 'true', delivered: document.getElementById('orderDelivered').value === 'true', partyId: document.getElementById('orderPartyId').value || null };
            orders.push(newOrder);
            saveKey(STORAGE_KEYS.orders, orders);
            hideModal('newOrderModal'); renderOrders(); renderDashboard(); renderClients();
        });
        document.getElementById('newClientForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients));
            const newClient = { id: `client_${Date.now()}`, name: document.getElementById('clientName').value, address: document.getElementById('clientAddress').value, contact: document.getElementById('clientContact').value, notes: '', createdAt: new Date().toISOString() };
            clients.push(newClient);
            saveKey(STORAGE_KEYS.clients, clients);
            hideModal('newClientModal'); renderClients();
        });
        document.getElementById('newExpenseForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let expenses = JSON.parse(localStorage.getItem(STORAGE_KEYS.expenses)) || [];
            const newExp = { id: `exp_${Date.now()}`, date: document.getElementById('expenseDate').value, category: document.getElementById('expenseCategory').value, detail: document.getElementById('expenseDetail').value, quantity: parseFloat(document.getElementById('expenseQty').value), totalPrice: parseFloat(document.getElementById('expenseTotal').value) };
            expenses.push(newExp);
            saveKey(STORAGE_KEYS.expenses, expenses);
            updateCostFromExpenses();
            hideModal('newExpenseModal'); renderExpenses(); renderDashboard();
        });
        document.getElementById('newAchievementForm').addEventListener('submit', (e) => {
            e.preventDefault();
            let achievements = JSON.parse(localStorage.getItem(STORAGE_KEYS.achievements)) || [];
            achievements.push({ id: `ach_${Date.now()}`, date: new Date().toISOString().slice(0,10), description: document.getElementById('achievementDesc').value, category: document.getElementById('achievementCat').value });
            saveKey(STORAGE_KEYS.achievements, achievements);
            hideModal('newAchievementModal'); renderReports();
        });
        function fillSelectors() {
            const clients = JSON.parse(localStorage.getItem(STORAGE_KEYS.clients));
            const clientSelect = document.getElementById('orderClient');
            if(clientSelect) clientSelect.innerHTML = clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
            const parties = JSON.parse(localStorage.getItem(STORAGE_KEYS.parties));
            const partySelect = document.getElementById('orderPartyId');
            if(partySelect) partySelect.innerHTML = '<option value="">Не выбрано</option>' + parties.map(p=>`<option value="${p.id}">${p.culture} (${p.dateSown})</option>`).join('');
        }
        
        // Навигация + рендер
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
                document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
                this.classList.add('active');
                const section = this.getAttribute('data-section');
                document.getElementById(section).classList.add('active');
                if(section === 'dashboard') renderDashboard();
                if(section === 'batches') renderBatches();
                if(section === 'orders') renderOrders();
                if(section === 'clients') renderClients();
                if(section === 'expenses') { renderExpenses(); updateCostFromExpenses(); }
                if(section === 'reports') renderReports();
                fillSelectors();
            });
        });
        
        function showModal(id) { document.getElementById(id).style.display = 'block'; fillSelectors(); }
        window.showModal = showModal;
        window.hideModal = (id) => document.getElementById(id).style.display = 'none';
        
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ru-RU');
        fillSelectors(); renderDashboard(); renderBatches(); renderOrders(); renderClients(); renderExpenses(); renderReports();
        window.nextStage = nextStage;
    </script>
</body>
</html>
